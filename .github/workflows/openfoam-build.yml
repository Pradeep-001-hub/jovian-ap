name: OpenFOAM Foundation v14 Build

on:
  push:
    paths:
      - "openfoam/solvers/**"
      - ".github/workflows/openfoam-build.yml"
  pull_request:
    paths:
      - "openfoam/solvers/**"
      - ".github/workflows/openfoam-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile JOVIAN-AP Solver
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenFOAM Foundation v14
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 14

      - name: Verify OpenFOAM environment
        run: |
          echo "OpenFOAM version: $WM_PROJECT_VERSION"
          echo "OpenFOAM directory: $WM_PROJECT_DIR"
          test "$WM_PROJECT_VERSION" = "14"
          test -f "$WM_PROJECT_DIR/etc/bashrc"

      - name: Inspect OpenFOAM finite-volume headers
        run: |
          echo "OpenFOAM root: $WM_PROJECT_DIR"
          echo "Checking for fvCFD.H..."
          find "$WM_PROJECT_DIR/src" \
            -name fvCFD.H -print
          echo "Checking finiteVolume directory..."
          ls -la "$WM_PROJECT_DIR/src/finiteVolume" | head -40
          echo "Checking lnInclude directory..."
          ls -la "$WM_PROJECT_DIR/src/finiteVolume/lnInclude" | head -40

      - name: Compile jovianShallowWater
        working-directory: openfoam/solvers/jovianShallowWater
        run: wmake